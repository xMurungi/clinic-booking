services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic-booking
      POSTGRES_PASSWORD: clinic-booking
      POSTGRES_DB: clinic-booking
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic-booking"]
      interval: 5s
      retries: 10

volumes:
  pgdata: